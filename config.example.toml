# Franky user config. Copy to ~/.franky/config and fill in.
# NEVER commit the real config (it contains secrets). The file is written to
# ~/.franky/config at mode 0600 (owner read/write only) by `franky config init`.
#
# All values are TOML basic strings. Set them interactively with:
#   franky config init       # full wizard
#   franky config set KEY    # set one key at a time
#   franky config list       # view the file (secrets masked)
#   franky config path       # show where the file lives

[franky]

# --- Engine selection -------------------------------------------------------
# Which coding agent runs inside the container. Default: pi.
#   pi     - vendor-neutral, bring-your-own-key (BYOK), many providers
#   claude - Claude Code (claude -p), uses your Claude subscription token
#   codex  - OpenAI Codex (codex exec), ChatGPT subscription or API-key auth
FRANKY_ENGINE = "pi"

# --- Per-job resource budgets (OPTIONAL, MiB) ------------------------------
# The task limit includes the engine, builds, and nested Docker containers.
# Memory: 256..8192 MiB. Each proxy has a separate fixed 128 MiB limit.
# Disk: 1024..32768 MiB. A five-second watchdog stops excess use; it is not a quota.
# FRANKY_MEMORY_MB = "2048"
# FRANKY_DISK_MB = "8192"

# --- Trusted-repo allowlist (REQUIRED, fail-closed) -------------------------
# Comma-separated owner/repo entries Franky is permitted to act on. Supports
# glob patterns per segment:
#   my-org/my-repo    - exact match
#   my-org/*          - whole org (every repo in my-org)
#   my-org/team-*     - repos with a prefix
#   *                 - every repo the GH_TOKEN can reach (its FULL scope - use
#                       carefully; this is a conscious opt-in, not a default)
# If this is unset or empty, Franky refuses every task.
FRANKY_ALLOWED_REPOS = "your-org/your-repo,your-org/another-repo"

# --- Egress allowlist extras (OPTIONAL, NOT fail-closed) --------------------
# The default allowlist already covers your provider + GitHub + npm/PyPI.
# Add extra comma-separated domains only if a task needs another host.
# FRANKY_EXTRA_ALLOWED_DOMAINS = "mirror.internal"

# --- GitHub (clone + open PR inside the container) --------------------------
# Scope this token narrowly: contents + pull_requests on the target repos only.
GH_TOKEN = "ghp_your_token_here"

# --- pi engine creds (BYOK - set ONE provider the engine should use) --------
# pi reads whichever provider var is present. Examples (pick one):
OPENROUTER_API_KEY = "sk-or-your_key_here"
# ANTHROPIC_API_KEY = "sk-ant-your_key_here"
# ANTHROPIC_OAUTH_TOKEN = "your_oauth_token_here"
# OPENAI_API_KEY = "sk-your_openai_key_here"
# GEMINI_API_KEY = "your_gemini_key_here"
# GROQ_API_KEY = "gsk_your_groq_key_here"
# MISTRAL_API_KEY = "your_mistral_key_here"
# OLLAMA_HOST = "http://your-ollama-host:11434"   # a host URL, not a secret

# --- claude engine creds (only needed when FRANKY_ENGINE = "claude") --------
# Long-lived subscription token from `claude setup-token`.
# CLAUDE_CODE_OAUTH_TOKEN = "your_oauth_token_here"

# --- codex engine creds (only needed when FRANKY_ENGINE = "codex") ----------
# Recommended for a ChatGPT subscription: run `franky auth login codex` once.
# This writes only the non-secret marker below; credentials stay in a Docker named volume.
# FRANKY_CODEX_SUBSCRIPTION = "1"
# Alternatively, use single-run API-key auth. It takes precedence over subscription auth.
# CODEX_API_KEY = "sk-your_codex_key_here"

# --- Auto-update hint on `franky build` (OPTIONAL, host CLI only) -----------
# FRANKY_NO_UPDATE_CHECK = "1"
# FRANKY_AUTO_UPDATE = "1"

# --- JIRA input (OPTIONAL, host-side only) ----------------------------------
# Needed only for `franky build jira <KEY> --repo owner/repo`.
# JIRA_BASE_URL = "https://your-org.atlassian.net"
# JIRA_EMAIL = "you@your-org.com"
# JIRA_API_TOKEN = "your_jira_api_token_here"

# --- Operator profile (OPTIONAL) -----------------------------------------------
# Path to a profile.toml that lists skills/instructions/knowledge files to inject
# into the container so the in-container agent sees your curated expertise.
# Auto-discovered from ~/.franky/profile.toml when that file exists.
# Override only if the profile lives elsewhere.
# Files are secret-scanned before injection; the run is refused (fail-closed) if
# any credential pattern is detected in a listed file.
# Tier-1 only: static prose (markdown, text). No MCP config, no secret-bearing files.
# FRANKY_PROFILE_PATH = "~/.franky/profile.toml"

# --- Image overrides (dev only) -----------------------------------------------
# FRANKY_IMAGE = "franky"
# FRANKY_PROXY_IMAGE = "franky-proxy"
# Retarget just the GHCR namespace (e.g. if you host the public images under a different org):
# FRANKY_GHCR_REPO = "ghcr.io/your-org"
