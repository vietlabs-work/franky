name: Release

# Triggered by a vX.Y.Z tag push (the real release path) or workflow_dispatch for a
# no-push dry run: both arches build natively, nothing pushes, merge and release are skipped.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to validate (no-push dry run)"
        required: true

# Read-only by default: guard, wheel and image run before the gate, so each job grants
# only the write scope it needs.
permissions:
  contents: read

jobs:
  footprint:
    uses: ./.github/workflows/footprint.yml
    with:
      mode: full
    permissions:
      contents: read

  # guard-before-publish: assert the three version sources agree before any tag or PyPI publish.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version consistency
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          fi
          python3 scripts/release.py guard "$TAG"
          # On a real tag push the checkout carries the release commit's CHANGELOG, so assert
          # the notes are extractable BEFORE anything publishes - otherwise a bad changelog
          # would strand published GHCR images with no GitHub Release. (Skipped on dispatch:
          # the versioned changelog section only exists after a release commit.)
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/release.py notes "${TAG#v}" > /dev/null
          fi

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  # Publish the built wheel + sdist to PyPI via Trusted Publishing (OIDC) - no stored token.
  # Push-only (a workflow_dispatch dry run builds the wheel but never publishes). Requires a
  # one-time PyPI "trusted publisher" registered for this repo + workflow + the `pypi`
  # environment (see docs/releasing.md).
  pypi:
    needs: [footprint, guard, wheel]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      # Pinned to a commit SHA (v1.14.0): a floating ref on an OIDC job holding id-token:write
      # is a supply-chain risk. skip-existing makes a re-run idempotent if a later job failed
      # after PyPI already published this version (PyPI forbids re-upload).
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true

  # One native runner per variant and arch (no QEMU), started at t=0 in parallel with the
  # footprint gate. A tag push publishes UNTAGGED digests only; `merge` applies the version and
  # latest tags after footprint + guard pass, so nothing is pullable by tag before the gate.
  image:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
        variant:
          - { name: franky, context: ., dockerfile: Dockerfile, engine: all, suffix: "" }
          - { name: franky, context: ., dockerfile: Dockerfile, engine: pi, suffix: -pi }
          - { name: franky, context: ., dockerfile: Dockerfile, engine: claude, suffix: -claude }
          - { name: franky, context: ., dockerfile: Dockerfile, engine: codex, suffix: -codex }
          - { name: franky, context: ., dockerfile: Dockerfile, engine: opencode, suffix: -opencode }
          - { name: franky-proxy, context: proxy, dockerfile: proxy/Dockerfile, engine: all, suffix: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Namespace tracks the repo's owning org, so moving the repo retargets the images with no
      # edit. The CLI's DEFAULT_GHCR_REPO (franky/container.py) must match that org.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.variant.context }}
          file: ${{ matrix.variant.dockerfile }}
          build-args: FRANKY_ENGINE=${{ matrix.variant.engine }}
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, matrix.variant.name) || 'type=cacheonly' }}
      - name: Export digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push'
        with:
          # arch first, so `digests-*-franky` never also matches `digests-*-franky-pi`.
          name: digests-${{ matrix.arch }}-${{ matrix.variant.name }}${{ matrix.variant.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The publish gate: tag each multi-arch manifest only after footprint, guard and every image
  # build succeeded.
  merge:
    needs: [footprint, guard, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - { name: franky, suffix: "" }
          - { name: franky, suffix: -pi }
          - { name: franky, suffix: -claude }
          - { name: franky, suffix: -codex }
          - { name: franky, suffix: -opencode }
          - { name: franky-proxy, suffix: "" }
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digests-*-${{ matrix.name }}${{ matrix.suffix }}
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag multi-arch manifest
        env:
          REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          SUFFIX: ${{ matrix.suffix }}
        working-directory: /tmp/digests
        run: |
          set -- *
          [ "$#" -eq 2 ] || { echo "expected 2 arch digests, got $#" >&2; exit 1; }
          docker buildx imagetools create \
            -t "$REF:${GITHUB_REF_NAME#v}$SUFFIX" -t "$REF:latest$SUFFIX" \
            "$REF@sha256:$1" "$REF@sha256:$2"

  # GitHub Release is created last - its existence implies the wheel + PyPI + images shipped.
  release:
    needs: [wheel, pypi, merge]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate release notes
        run: python3 scripts/release.py notes "${GITHUB_REF_NAME#v}" > /tmp/notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
