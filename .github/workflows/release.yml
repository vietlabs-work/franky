name: Release

# Triggered by a vX.Y.Z tag push (the real release path) or workflow_dispatch for a
# no-push dry run: single-arch build, push:false, the release job is skipped.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to validate (no-push dry run)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # guard-before-publish: assert the three version sources agree before touching GHCR or PyPI.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version consistency
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          fi
          python3 scripts/release.py guard "$TAG"
          # On a real tag push the checkout carries the release commit's CHANGELOG, so assert
          # the notes are extractable BEFORE anything publishes - otherwise a bad changelog
          # would strand published GHCR images with no GitHub Release. (Skipped on dispatch:
          # the versioned changelog section only exists after a release commit.)
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/release.py notes "${TAG#v}" > /dev/null
          fi

  wheel:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  # Publish the built wheel + sdist to PyPI via Trusted Publishing (OIDC) - no stored token.
  # Push-only (a workflow_dispatch dry run builds the wheel but never publishes). Requires a
  # one-time PyPI "trusted publisher" registered for this repo + workflow + the `pypi`
  # environment (see docs/releasing.md).
  pypi:
    needs: wheel
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      # Pinned to a commit SHA (v1.14.0): a floating ref on an OIDC job holding id-token:write
      # is a supply-chain risk. skip-existing makes a re-run idempotent if a later job failed
      # after PyPI already published this version (PyPI forbids re-upload).
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true

  image:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: franky
            context: .
            dockerfile: Dockerfile
            engine: all
            suffix: ""
          - name: franky
            context: .
            dockerfile: Dockerfile
            engine: pi
            suffix: -pi
          - name: franky
            context: .
            dockerfile: Dockerfile
            engine: claude
            suffix: -claude
          - name: franky
            context: .
            dockerfile: Dockerfile
            engine: codex
            suffix: -codex
          - name: franky
            context: .
            dockerfile: Dockerfile
            engine: opencode
            suffix: -opencode
          - name: franky-proxy
            context: proxy
            dockerfile: proxy/Dockerfile
            engine: all
            suffix: ""
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compute version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: FRANKY_ENGINE=${{ matrix.engine }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          # Namespace tracks the repo's owning org, so moving the repo retargets the images
          # with no edit. The CLI's DEFAULT_GHCR_REPO (franky/container.py) must match that org.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.VERSION }}${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest${{ matrix.suffix }}

  # GitHub Release is created last - its existence implies the wheel + PyPI + images shipped.
  release:
    needs: [wheel, pypi, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate release notes
        run: python3 scripts/release.py notes "${GITHUB_REF_NAME#v}" > /tmp/notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
