name: Private terms

# The private term list lives in the FRANKY_PRIVATE_TERMS Actions secret, never in the repo.
# The script fails closed when it is empty, so a fork PR (no secret access) fails by design.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  private-terms:
    name: private-terms
    runs-on: ubuntu-latest
    env:
      FRANKY_PRIVATE_TERMS: ${{ secrets.FRANKY_PRIVATE_TERMS }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan tracked files
        run: python3 scripts/private_terms.py files
      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/private_terms.py commits "$BASE..$HEAD"
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python3 scripts/private_terms.py commits "$AFTER"
          else
            python3 scripts/private_terms.py commits "$BEFORE..$AFTER"
          fi
      - name: Scan PR branch, title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          printf '%s\n' "$PR_BRANCH" | python3 scripts/private_terms.py text pr-branch
          printf '%s\n' "$PR_TITLE" | python3 scripts/private_terms.py text pr-title
          printf '%s\n' "$PR_BODY" | python3 scripts/private_terms.py text pr-body
